<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자바스크립트 실전테스트_todolist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
  <h2>자바스크립트 실전테스트_todolist</h2>
  <dl>
    <dt>오늘의 일정 구현하기</dt>
    <dd>1. 입력폼과 '추가'버튼, '글삭제'버튼을 작성</dd>
    <dd>2. 입력폼에 글입력하고 '추가'버튼 클릭시 아래 목록으로 내용 출력</dd>
    <dd>3. 출력내용 옆에 '삭제'버튼 추가</dd>
    <dd>4. '삭제'버튼 클릭시 해당 글 삭제</dd>
    <dd>5. 해당 목록 글 클릭시 '취소선'표시</dd>
    <dd>6. '글삭제'버튼 클릭시 전체 글 삭제</dd>
  </dl>

  <div>
    <header>
      <h2>오늘의 할일 - todolist(입력,출력,삭제)</h2>
      <div>
        <input type="text" placeholder="오늘의 일정을 입력하세요." id="addValue">
                
        <button type="submit" id="btn">
          <i class="fas fa-plus"></i>
        </button>

      </div>
    </header>

    <!-- 메인영역 시작 -->
    <main>
      <section>
        <ul>
          <li><div id="result">글내용이 출력되는 곳</div></li>
        </ul>
        <p>
          <button id="del_btn">글모두 삭제</button>
        </p>
      </section>
    </main>

    <!-- 푸터영역 시작 -->
    <footer>
      <address>Copyright&copy;2026 오늘의 할일 allrights reserved.</address>
    </footer>
  </div>

  <script>
    //1. 변수선언
    const btn = document.getElementById('btn'); //입력버튼 변수
    const del_btn = document.getElementById('del_btn'); //삭제버튼 변수
    let result = document.querySelector('ul');//출력되는 곳 변수
    const addValue = document.getElementById('addValue'); //입력폼 변수

    //2. 글추가 버튼(+) 클릭시 내용 출력하는 함수 호출하기
    btn.addEventListener('click', function(){
      addTo(); //함수 호출하기
    });

    //3. 내용 출력을 위한 함수
    function addTo(){
      //alert('글 내용 추가');
      if(addValue.value===''){             //입력양식에 내용이 비어있다면
        alert('글내용을 입력하세요.');      //메세지 띄우고
      }else{ //그렇지 않다면(글 입력을 했다면)
        let list = document.createElement('li');
        let del = document.createElement('button');

        list.innerHTML=addValue.value;    //목록에 글내용을 출력한다.

        result.appendChild(list); //ul태그의 자손으로 li태그를 추가한다.
        list.appendChild(del); //li태그의 자손으로 button태그를 추가한다.

        addValue.value=''//기존 입력한 글은 지운다.
        addValue.focus();//입력창에 커서가 나오도록 한다.

        //삭제 버튼에 서식 적용하기
        del.innerText = 'X';
        del.style.fontSize='20px';
        del.style.border='none';
        del.style.position='relative';
        del.style.left='10px';
        del.style.cursor='pointer';

        let i = 1; //변수선언

        //해당 글 목록을 클릭시 '취소선', 글자색 '회색'으로 표시
        list.addEventListener('click', function(){
          if(i==0){
            //서식을 변경하고
            list.style.textDecoration='line-through'; //취소선
            list.style.color='gray'; //글자색 흐리게

            i=1; //변수에 1값을 저장
          }else{ //i값이 1일 경우
            //다시 해당 글 목록 클릭시 원래대로 서식변경하기
            list.style.textDecoration='none';
            list.style.color='#333';
            i=0;
          }
        });
        
        //del(X)버튼을 클릭하면 해당 글 삭제하기 => 클릭한 li태그를 삭제해야.....
        del.addEventListener('click', function(e){
          let li_remove = e.target.parentElement;

          li_remove.remove(); //닫기 버튼의 부모 li태그를 지운다.
        });
      }
    }

    //전체글 삭제하기
    del_btn.addEventListener('click', function(){
      clearAll(); //함수호출
    });

    //전체글 삭제 함수
    function clearAll(){
      if(confirm('버튼을 클릭시 글 내용이 모두 삭제됩니다. 정말로 실행하시겠습니까?')==true){
        if(result.innerText==''){
          alert('삭제할 글 목록이 없습니다.');
        }else{
          result.innerText='';
        }
      }else{ //취소시
        return false; //아무일도 일어나지 않음.
      }
    };
  </script>
</body>
</html>
